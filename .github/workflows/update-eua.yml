name: Update EU ETS Auction Prices (EEX)

on:
  schedule:
    # EU auctions clear at 11:00 CET on weekdays; EEX's report follows.
    - cron: "40 12 * * *"
  # TEMPORARY: one-off first fetch from the feature branch.
  push:
    branches: ["eua-auctions"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-eua
  cancel-in-progress: false

jobs:
  update-eua:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore current data from the data branch
        run: bash .github/scripts/data-branch.sh restore

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch EU ETS auction prices
        run: python etl/fetch_eua.py

      - name: Publish updated data to the data branch
        run: bash .github/scripts/data-branch.sh publish app/data/eua.json
