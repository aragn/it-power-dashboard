name: Probe GIE APIs (temporary)

on:
  push:
    branches: [gas-lng]
    paths: [etl/_probe_gie.py, etl/fetch_gas.py, .github/workflows/probe-gie.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Fetch gas data
        env:
          GIE_KEY: ${{ secrets.AGSI_KEY }}
        run: python etl/fetch_gas.py --full-history
      - uses: actions/upload-artifact@v4
        with:
          name: gas-json
          path: app/data/gas.json
