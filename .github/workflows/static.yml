# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes to the default branch, and to the data branch when the
  # private repository publishes the public version of GME's data there
  # (pushed with a token, so it starts workflows, unlike the GITHUB_TOKEN).
  push:
    branches: ["main", "data"]

  # Data commits pushed by the update workflows use GITHUB_TOKEN, which
  # does not trigger "push" events, so redeploy when one of them finishes.
  workflow_run:
    workflows:
      - "Update Generation & Load (ENTSO-E)"
      - "Update Cross-Border Exchanges (ENTSO-E)"
      - "Update Neighbour Day-Ahead Prices (ENTSO-E)"
      - "Update Day-Ahead Forecasts (ENTSO-E)"
      - "Update EU ETS Auction Prices (EEX)"
      - "Update Wind & Solar Forecasts (ENTSO-E)"
      - "Update Terna Geothermal & Total Load"
      - "Update Installed Capacity & Unavailability"
      - "Monthly Data Checks"
      - "Update Balancing (ENTSO-E, Terna)"
      - "Update Price Spreads (JAO)"
      - "Update Cross-Zonal Capacity (JAO)"
      - "Update PICASSO Prices (TransnetBW)"
      - "Update Gas Storage & LNG (GIE)"
      - "Update MASE Projects (VIA)"
      - "Update Grid Connection Queue (Terna, e-distribuzione)"
    types: [completed]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Deploy the latest main, including the data commit just pushed.
          ref: main
      - name: Restore data files from the data branch
        run: bash .github/scripts/data-branch.sh restore
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload entire repository
          path: './app'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
