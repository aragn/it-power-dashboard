name: Update MASE Projects (VIA)

on:
  schedule:
    # Daily: new projects and the pages checked longest ago.
    - cron: "20 4 * * *"
    # Sundays: every listing page and every project page.
    - cron: "50 2 * * 0"
  workflow_dispatch:
    inputs:
      full:
        description: "Read every listing page and every project page"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-mase
  cancel-in-progress: false

jobs:
  update-mase:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore current data from the data branch
        run: bash .github/scripts/data-branch.sh restore

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch MASE projects
        env:
          FULL: ${{ inputs.full || github.event.schedule == '50 2 * * 0' }}
        run: |
          ARGS=()
          if [ "$FULL" = "true" ]; then ARGS+=(--full); fi
          echo "Running: python etl/fetch_mase.py ${ARGS[*]}"
          python -u etl/fetch_mase.py "${ARGS[@]}"

      - name: Publish updated data to the data branch
        run: bash .github/scripts/data-branch.sh publish app/data/mase_projects.json
