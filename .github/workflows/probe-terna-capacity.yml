name: Probe Terna available capacity (temporary)
on:
  push:
    branches: [terna-available-capacity]
    paths: [etl/probe_terna_capacity.py, .github/workflows/probe-terna-capacity.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - env:
          TERNA_KEY: ${{ secrets.TERNA_KEY }}
          TERNA_SECRET: ${{ secrets.TERNA_SECRET }}
        run: cd etl && python probe_terna_capacity.py
