name: Update Market Coupling (GME)

on:
  schedule:
    # Daily at 00:35 UTC, between the other GME runs.
    - cron: "35 0 * * *"
  # TEMPORARY: one-off full-history fetch from the feature branch.
  push:
    branches: ["market-coupling"]
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYYMMDD (default: 7 days ago)"
        required: false
      end:
        description: "End date YYYYMMDD (default: today)"
        required: false
      full_history:
        description: "Rebuild from 2025-01-01"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-market-coupling
  cancel-in-progress: false

jobs:
  update-market-coupling:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore current data from the data branch
        run: bash .github/scripts/data-branch.sh restore

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch market coupling results
        env:
          GME_API_LOGIN: ${{ secrets.GME_API_LOGIN }}
          GME_API_PASSWORD: ${{ secrets.GME_API_PASSWORD }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.start }}" ]; then ARGS+=(--start "${{ inputs.start }}"); fi
          if [ -n "${{ inputs.end }}" ]; then ARGS+=(--end "${{ inputs.end }}"); fi
          if [ "${{ inputs.full_history }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            ARGS+=(--full-history)
          fi
          echo "Running: python etl/fetch_coupling.py ${ARGS[*]}"
          python etl/fetch_coupling.py "${ARGS[@]}"

      - name: Publish updated data to the data branch
        run: bash .github/scripts/data-branch.sh publish app/data/coupling.json
