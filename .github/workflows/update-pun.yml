name: Update PUN data

on:
  schedule:
    # Daily at 00:00 UTC (09:00 JST).
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pun
  cancel-in-progress: false

jobs:
  update-pun:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Restore current data from the data branch
        run: bash .github/scripts/data-branch.sh restore

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch PUN data
        env:
          GME_API_LOGIN: ${{ secrets.GME_API_LOGIN }}
          GME_API_PASSWORD: ${{ secrets.GME_API_PASSWORD }}
        run: |
          if [ -n "${{ inputs.start }}" ]; then
            START="${{ inputs.start }}"
          else
            START=$(date -u -d "60 days ago" +%Y%m%d)
          fi

          if [ -n "${{ inputs.end }}" ]; then
            END="${{ inputs.end }}"
          else
            END=$(date -u +%Y%m%d)
          fi

          echo "Fetching PUN data from $START to $END"

          python etl/fetch_pun.py \
            --start "$START" \
            --end "$END"

      - name: Publish updated data to the data branch
        run: bash .github/scripts/data-branch.sh publish app/data/pun.json
