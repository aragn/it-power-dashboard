name: Update Wind & Solar Forecasts (ENTSO-E)

on:
  schedule:
    # The intraday wind and solar forecasts are revised during the day and
    # the day-ahead ones for tomorrow are due by 18:00 Brussels time, so
    # this runs every hour (two small requests per run).
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYYMMDD (default: 7 days ago)"
        required: false
      end:
        description: "End date YYYYMMDD (default: tomorrow)"
        required: false
      full_history:
        description: "Rebuild from 2025-01-01"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-res-forecasts
  cancel-in-progress: false

jobs:
  update-res-forecasts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore current data from the data branch
        run: bash .github/scripts/data-branch.sh restore

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch wind and solar forecasts
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.start }}" ]; then ARGS+=(--start "${{ inputs.start }}"); fi
          if [ -n "${{ inputs.end }}" ]; then ARGS+=(--end "${{ inputs.end }}"); fi
          if [ "${{ inputs.full_history }}" = "true" ]; then
            ARGS+=(--full-history)
          fi
          echo "Running: python etl/fetch_res_forecasts.py ${ARGS[*]}"
          python etl/fetch_res_forecasts.py "${ARGS[@]}"

      - name: Publish updated data to the data branch
        run: bash .github/scripts/data-branch.sh publish app/data/res_forecasts.json
