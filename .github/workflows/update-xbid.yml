name: Update Continuous Intraday Prices (GME MI-XBID)

on:
  schedule:
    # The MI-XBID totals ("Esiti totali") of a day are published during the
    # following night.  02:10 UTC is after they were seen available and
    # clear of the other GME runs (00:00-00:50 UTC); 06:10 UTC is a backup.
    - cron: "10 2 * * *"
    - cron: "10 6 * * *"
  # TEMPORARY: first full-history fetch from the feature branch.
  push:
    branches: [xbid-prices]
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYYMMDD (default: 7 days ago)"
        required: false
      end:
        description: "End date YYYYMMDD (default: today)"
        required: false
      full_history:
        description: "Rebuild from 2025-01-01"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-xbid-prices
  cancel-in-progress: false

jobs:
  update-xbid-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore current data from the data branch
        run: bash .github/scripts/data-branch.sh restore

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch MI-XBID reference prices
        env:
          GME_API_LOGIN: ${{ secrets.GME_API_LOGIN }}
          GME_API_PASSWORD: ${{ secrets.GME_API_PASSWORD }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.start }}" ]; then ARGS+=(--start "${{ inputs.start }}"); fi
          if [ -n "${{ inputs.end }}" ]; then ARGS+=(--end "${{ inputs.end }}"); fi
          if [ "${{ inputs.full_history }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            ARGS+=(--full-history)
          fi
          echo "Running: python etl/fetch_xbid.py ${ARGS[*]}"
          python etl/fetch_xbid.py "${ARGS[@]}"

      - name: Publish updated data to the data branch
        run: bash .github/scripts/data-branch.sh publish app/data/xbid_prices.json
