name: Monthly Data Checks

on:
  schedule:
    # On the 8th: Terna's per-unit available capacity for the previous month
    # is final 7 days after each day.
    - cron: "30 5 8 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to check against Terna, YYYY-MM (default: previous month)"
        required: false

permissions:
  contents: write

concurrency:
  # Shares the group with the daily unavailability job, which writes the same files.
  group: update-capacity
  cancel-in-progress: false

jobs:
  monthly-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore current data from the data branch
        run: bash .github/scripts/data-branch.sh restore

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Rebuild the unavailability history (picks up corrections older than 45 days)
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python etl/fetch_outages.py --full-history

      - name: Check revisions and compare with Terna
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          # The second key first (the main one is the balancing runs'), then
          # the main and the third when one's 300 calls of the day are used up.
          TERNA_KEY_2: ${{ secrets.SECOND_NAME_TERNA }}
          TERNA_SECRET_2: ${{ secrets.SECRET_SECOND_TERNA }}
          TERNA_KEY: ${{ secrets.TERNA_KEY }}
          TERNA_SECRET: ${{ secrets.TERNA_SECRET }}
          TERNA_KEY_3: ${{ secrets.TERNA_TERZO }}
          TERNA_SECRET_3: ${{ secrets.TERNA_SEGRETO_TERZO }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.month }}" ]; then ARGS+=(--month "${{ inputs.month }}"); fi
          python etl/check_outages_monthly.py "${ARGS[@]}"

      - name: Publish updated data to the data branch
        run: bash .github/scripts/data-branch.sh publish app/data/outages.json app/data/outage_units.json app/data/data_checks.json
