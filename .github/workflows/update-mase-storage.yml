name: Update MASE Battery Authorisations

on:
  schedule:
    # Daily: the newest decrees.
    - cron: "40 4 * * *"
    # Sundays: every listing page and every decree page.
    - cron: "10 3 * * 0"
  workflow_dispatch:
    inputs:
      full:
        description: "Read every listing page and every decree page"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-mase-storage
  cancel-in-progress: false

jobs:
  update-mase-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore current data from the data branch
        run: bash .github/scripts/data-branch.sh restore

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch MASE battery authorisations
        env:
          FULL: ${{ inputs.full || github.event.schedule == '10 3 * * 0' }}
        run: |
          ARGS=()
          if [ "$FULL" = "true" ]; then ARGS+=(--full); fi
          echo "Running: python etl/fetch_mase_storage.py ${ARGS[*]}"
          python -u etl/fetch_mase_storage.py "${ARGS[@]}"

      - name: Publish updated data to the data branch
        run: bash .github/scripts/data-branch.sh publish app/data/mase_storage.json
