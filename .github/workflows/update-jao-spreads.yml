name: Update Price Spreads (JAO)

on:
  schedule:
    # JAO publishes the day-ahead spreads after the coupling (about 13:00
    # Italian time) and each intraday auction's soon after it closes (IDA 1
    # 15:00 and IDA 2 22:00 the day before, IDA 3 10:00 on the day).  Every
    # 3 hours, since GitHub starts scheduled runs late or not at all when busy.
    - cron: "50 0-23/3 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD (default: 3 days ago)"
        required: false
      end:
        description: "End date YYYY-MM-DD (default: tomorrow)"
        required: false
      full_history:
        description: "Rebuild from 2025-01-01"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-jao-spreads
  cancel-in-progress: false

jobs:
  update-jao-spreads:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore current data from the data branch
        run: bash .github/scripts/data-branch.sh restore

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch price spreads
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          FULL_HISTORY: ${{ inputs.full_history }}
        run: |
          ARGS=()
          if [ -n "$START" ]; then ARGS+=(--start "$START"); fi
          if [ -n "$END" ]; then ARGS+=(--end "$END"); fi
          if [ "$FULL_HISTORY" = "true" ]; then ARGS+=(--full-history); fi
          echo "Running: python etl/fetch_jao_spreads.py ${ARGS[*]}"
          python etl/fetch_jao_spreads.py "${ARGS[@]}"

      - name: Publish updated data to the data branch
        run: bash .github/scripts/data-branch.sh publish app/data/jao_spreads.json
