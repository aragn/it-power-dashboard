name: Update Generation & Load (ENTSO-E)

on:
  schedule:
    # Hourly at :20. Off the top of the hour, when GitHub's scheduler is
    # busiest and most likely to delay or drop runs.
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYYMMDD (default: 7 days ago)"
        required: false
      end:
        description: "End date YYYYMMDD (default: today)"
        required: false
      full_history:
        description: "Rebuild from 2025-01-01"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-generation-load
  cancel-in-progress: false

jobs:
  update-generation-load:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore current data from the data branch
        run: bash .github/scripts/data-branch.sh restore

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Probe ENTSO-E per bidding zone (temporary)
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python etl/probe_entsoe_zones.py 2026-10-11
