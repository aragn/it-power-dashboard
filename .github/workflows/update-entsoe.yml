name: Update Generation & Load (ENTSO-E)

on:
  schedule:
    # Hourly at :20. Off the top of the hour, when GitHub's scheduler is
    # busiest and most likely to delay or drop runs.
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYYMMDD (default: 7 days ago)"
        required: false
      end:
        description: "End date YYYYMMDD (default: today)"
        required: false
      full_history:
        description: "Rebuild from 2025-01-01"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-generation-load
  cancel-in-progress: false

jobs:
  update-generation-load:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore current data from the data branch
        run: bash .github/scripts/data-branch.sh restore

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch generation & load data
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          ARGS=()

          if [ -n "${{ inputs.start }}" ]; then
            ARGS+=(--start "${{ inputs.start }}")
          fi

          if [ -n "${{ inputs.end }}" ]; then
            ARGS+=(--end "${{ inputs.end }}")
          fi

          if [ "${{ inputs.full_history }}" = "true" ]; then
            ARGS+=(--full-history)
          fi

          echo "Running: python etl/fetch_entsoe.py ${ARGS[*]}"
          python etl/fetch_entsoe.py "${ARGS[@]}"

      - name: Publish updated data to the data branch
        run: bash .github/scripts/data-branch.sh publish app/data/generation_load.json
