name: Update Generation & Load (ENTSO-E)

on:
  schedule:
    # Daily at 00:30 UTC (09:30 JST).
    # Kept 15 minutes after zonal prices to reduce API overlap.
    - cron: "30 0 * * *"
  workflow_dispatch:
    

permissions:
  contents: write

concurrency:
  group: update-generation-load
  cancel-in-progress: false

jobs:
  update-generation-load:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch generation & load data
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          ARGS=()

          if [ -n "${{ inputs.start }}" ]; then
            ARGS+=(--start "${{ inputs.start }}")
          fi

          if [ -n "${{ inputs.end }}" ]; then
            ARGS+=(--end "${{ inputs.end }}")
          fi

          if [ "${{ inputs.full_history }}" = "true" ]; then
            ARGS+=(--full-history)
          fi

          echo "Running: python etl/fetch_entsoe.py ${ARGS[*]}"
          python etl/fetch_entsoe.py "${ARGS[@]}"

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add app/data/generation_load.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update generation & load data [automated]"
            git push
          fi
