name: Update Cross-Zonal Capacity (JAO)

on:
  schedule:
    # JAO publishes the D-2 capacity calculation (NTC, allocation constraint,
    # CNECs) two days ahead, the day-ahead results after the coupling (about
    # 13:00 Italian time) and the intraday ones after each auction.  Every
    # 3 hours, since GitHub starts scheduled runs late or not at all when busy.
    - cron: "55 0-23/3 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD (default: 3 days ago)"
        required: false
      end:
        description: "End date YYYY-MM-DD (default: tomorrow)"
        required: false
      full_history:
        description: "Rebuild from 2025-01-01"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-jao-capacity
  cancel-in-progress: false

jobs:
  update-jao-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore current data from the data branch
        run: bash .github/scripts/data-branch.sh restore

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch cross-zonal capacity data
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          FULL_HISTORY: ${{ inputs.full_history }}
        run: |
          ARGS=()
          if [ -n "$START" ]; then ARGS+=(--start "$START"); fi
          if [ -n "$END" ]; then ARGS+=(--end "$END"); fi
          if [ "$FULL_HISTORY" = "true" ]; then ARGS+=(--full-history); fi
          echo "Running: python etl/fetch_jao_capacity.py ${ARGS[*]}"
          python etl/fetch_jao_capacity.py "${ARGS[@]}"

      - name: Publish updated data to the data branch
        run: bash .github/scripts/data-branch.sh publish app/data/jao_capacity.json
