name: Update Installed Capacity & Unavailability

on:
  schedule:
    # Unavailability (ENTSO-E 15.1): daily, re-reading 45 days back and 14
    # ahead, since outages are revised after the fact.
    - cron: "45 3 * * *"
    # Installed capacity (Terna yearly, ENTSO-E 14.1.A/B): monthly, on the
    # 1st; new years appear when Terna and ENTSO-E publish them.
    - cron: "15 4 1 * *"
  workflow_dispatch:
    inputs:
      full_history:
        description: "Rebuild the unavailability history from 2025-01-01"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-capacity
  cancel-in-progress: false

jobs:
  update-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore current data from the data branch
        run: bash .github/scripts/data-branch.sh restore

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch installed capacity
        # Monthly run, manual runs, and whenever the file is missing.
        if: github.event.schedule == '15 4 1 * *' || github.event_name != 'schedule' || hashFiles('app/data/capacity.json') == ''
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          # The second key first (the main one is the balancing runs'), then
          # the main and the third when one's 300 calls of the day are used up.
          TERNA_KEY_2: ${{ secrets.SECOND_NAME_TERNA }}
          TERNA_SECRET_2: ${{ secrets.SECRET_SECOND_TERNA }}
          TERNA_KEY: ${{ secrets.TERNA_KEY }}
          TERNA_SECRET: ${{ secrets.TERNA_SECRET }}
          TERNA_KEY_3: ${{ secrets.TERNA_TERZO }}
          TERNA_SECRET_3: ${{ secrets.TERNA_SEGRETO_TERZO }}
        run: python etl/fetch_capacity.py

      - name: Fetch unavailability of generation units
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          ARGS=()
          if [ "${{ inputs.full_history }}" = "true" ] || [ ! -f app/data/outages.json ] || [ ! -f app/data/outage_units.json ]; then
            ARGS+=(--full-history)
          fi
          echo "Running: python etl/fetch_outages.py ${ARGS[*]}"
          python etl/fetch_outages.py "${ARGS[@]}"

      - name: Publish updated data to the data branch
        run: |
          FILES=(app/data/outages.json app/data/outage_units.json)
          if [ -f app/data/capacity.json ]; then FILES+=(app/data/capacity.json); fi
          bash .github/scripts/data-branch.sh publish "${FILES[@]}"
