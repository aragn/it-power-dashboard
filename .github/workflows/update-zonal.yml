name: Update Zonal Prices

on:
  schedule:
    # Daily at 00:15 UTC (09:15 JST).
    # Kept 15 minutes after PUN to reduce API overlap.
    - cron: "15 0 * * *"
  workflow_dispatch:
    

permissions:
  contents: write

concurrency:
  group: update-zonal-prices
  cancel-in-progress: false

jobs:
  update-zonal-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch zonal prices
        env:
          GME_API_LOGIN: ${{ secrets.GME_API_LOGIN }}
          GME_API_PASSWORD: ${{ secrets.GME_API_PASSWORD }}
        run: |
          ARGS=()

          if [ -n "${{ inputs.start }}" ]; then
            ARGS+=(--start "${{ inputs.start }}")
          fi

          if [ -n "${{ inputs.end }}" ]; then
            ARGS+=(--end "${{ inputs.end }}")
          fi

          if [ "${{ inputs.full_history }}" = "true" ]; then
            ARGS+=(--full-history)
          fi

          echo "Running: python etl/fetch_zonal.py ${ARGS[*]}"
          python etl/fetch_zonal.py "${ARGS[@]}"

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add app/data/zonal_prices.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update zonal prices [automated]"
            git push
          fi
