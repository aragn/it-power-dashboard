name: TEMPORARY probe PICASSO per zone

on:
  push:
    branches: [balancing]
    paths: [etl/probe_picasso.py, .github/workflows/probe-picasso.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Probe
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          TERNA_KEY: ${{ secrets.TERNA_KEY }}
          TERNA_SECRET: ${{ secrets.TERNA_SECRET }}
          GME_API_LOGIN: ${{ secrets.GME_API_LOGIN }}
          GME_API_PASSWORD: ${{ secrets.GME_API_PASSWORD }}
        run: cd etl && (python probe_picasso.py; mv probe ..)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe
          retention-days: 3
