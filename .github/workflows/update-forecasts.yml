name: Update Day-Ahead Forecasts (ENTSO-E)

on:
  schedule:
    # The day-ahead load and generation forecasts for tomorrow are due by
    # 18:00 Brussels time; 17:15 UTC is after that in summer and winter
    # time.  05:15 UTC is a backup run that also picks up revisions.
    - cron: "15 17 * * *"
    - cron: "15 5 * * *"
  # TEMPORARY: one-off full-history fetch from the feature branch.
  push:
    branches: ["forecasts"]
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYYMMDD (default: 7 days ago)"
        required: false
      end:
        description: "End date YYYYMMDD (default: tomorrow)"
        required: false
      full_history:
        description: "Rebuild from 2025-01-01"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-forecasts
  cancel-in-progress: false

jobs:
  update-forecasts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore current data from the data branch
        run: bash .github/scripts/data-branch.sh restore

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch day-ahead forecasts
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.start }}" ]; then ARGS+=(--start "${{ inputs.start }}"); fi
          if [ -n "${{ inputs.end }}" ]; then ARGS+=(--end "${{ inputs.end }}"); fi
          if [ "${{ inputs.full_history }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            ARGS+=(--full-history)
          fi
          echo "Running: python etl/fetch_forecasts.py ${ARGS[*]}"
          python etl/fetch_forecasts.py "${ARGS[@]}"

      - name: Publish updated data to the data branch
        run: bash .github/scripts/data-branch.sh publish app/data/forecasts.json
