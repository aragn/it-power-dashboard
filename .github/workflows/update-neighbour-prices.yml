name: Update Neighbour Day-Ahead Prices (ENTSO-E)

on:
  schedule:
    # Day-ahead results for tomorrow are out around 13:00 Italian time;
    # 13:25 UTC leaves margin in summer and winter time.  01:25 UTC is a
    # backup run that also picks up late corrections.
    - cron: "25 13 * * *"
    - cron: "25 1 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYYMMDD (default: 7 days ago)"
        required: false
      end:
        description: "End date YYYYMMDD (default: tomorrow)"
        required: false
      full_history:
        description: "Rebuild from 2025-01-01"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-neighbour-prices
  cancel-in-progress: false

jobs:
  update-neighbour-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore current data from the data branch
        run: bash .github/scripts/data-branch.sh restore

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch day-ahead prices
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.start }}" ]; then ARGS+=(--start "${{ inputs.start }}"); fi
          if [ -n "${{ inputs.end }}" ]; then ARGS+=(--end "${{ inputs.end }}"); fi
          if [ "${{ inputs.full_history }}" = "true" ]; then
            ARGS+=(--full-history)
          fi
          echo "Running: python etl/fetch_neighbour_prices.py ${ARGS[*]}"
          python etl/fetch_neighbour_prices.py "${ARGS[@]}"

      - name: Publish updated data to the data branch
        run: bash .github/scripts/data-branch.sh publish app/data/neighbour_prices.json
