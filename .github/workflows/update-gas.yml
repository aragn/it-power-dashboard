name: Update Gas Storage & LNG (GIE)

on:
  schedule:
    # GIE publishes each gas day at 19:30 CET, with late operators at 23:00;
    # a morning run in case GitHub skips one.
    - cron: "40 6,18,22 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "First gas day to re-read YYYY-MM-DD (default: the last 40 days)"
        required: false
      full_history:
        description: "Re-read everything (storage from 2020 for Italy, the rest from 2025)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-gas
  cancel-in-progress: false

jobs:
  update-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore current data from the data branch
        run: bash .github/scripts/data-branch.sh restore

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch gas storage, LNG and UMMs
        env:
          GIE_KEY: ${{ secrets.AGSI_KEY }}
          START: ${{ inputs.start }}
          FULL_HISTORY: ${{ inputs.full_history }}
        run: |
          ARGS=()
          if [ -n "$START" ]; then ARGS+=(--start "$START"); fi
          if [ "$FULL_HISTORY" = "true" ]; then ARGS+=(--full-history); fi
          echo "Running: python etl/fetch_gas.py ${ARGS[*]}"
          python etl/fetch_gas.py "${ARGS[@]}"

      - name: Publish updated data to the data branch
        run: bash .github/scripts/data-branch.sh publish app/data/gas.json
