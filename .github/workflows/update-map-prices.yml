name: Update Map Prices (ENTSO-E)

on:
  schedule:
    # The prices and flows map's own ENTSO-E prices: the Italian zones'
    # day-ahead prices (out around 13:00 Italian time; 13:30 UTC leaves
    # margin in summer and winter time) and the neighbours' imbalance prices,
    # published within the hour (every 3 hours, as the balancing job).
    - cron: "30 13 * * *"
    - cron: "10 1-22/3 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYYMMDD (default: 7 days ago; the first run reads from 2025-01-01)"
        required: false
      end:
        description: "End date YYYYMMDD (default: tomorrow)"
        required: false
      full_history:
        description: "Rebuild from 2025-01-01"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-map-prices
  cancel-in-progress: false

jobs:
  update-map-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore current data from the data branch
        run: bash .github/scripts/data-branch.sh restore

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch the map's prices
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.start }}" ]; then ARGS+=(--start "${{ inputs.start }}"); fi
          if [ -n "${{ inputs.end }}" ]; then ARGS+=(--end "${{ inputs.end }}"); fi
          if [ "${{ inputs.full_history }}" = "true" ]; then
            ARGS+=(--full-history)
          fi
          echo "Running: python etl/fetch_map_prices.py ${ARGS[*]}"
          python etl/fetch_map_prices.py "${ARGS[@]}"

      - name: Publish updated data to the data branch
        run: bash .github/scripts/data-branch.sh publish app/data/map_prices.json
