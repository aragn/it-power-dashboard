name: Update Balancing (ENTSO-E, Terna, GME)

on:
  schedule:
    # ENTSO-E publishes the imbalance prices, activations and bids within
    # the hour; Terna's final macrozonal imbalance at 17:00 on D+1; GME's
    # MSD ex-ante results for D+1 by 21:45 Italian time.
    - cron: "40 1,7,13,19 * * *"
  push:
    # TEMPORARY: backfill the test week from the feature branch.
    branches: [balancing]
    paths: [etl/fetch_balancing.py, .github/workflows/update-balancing.yml]
  workflow_dispatch:
    inputs:
      start:
        description: "First market day YYYY-MM-DD (default: 3 days ago)"
        required: false
      end:
        description: "Last market day YYYY-MM-DD (default: tomorrow)"
        required: false
      sources:
        description: "Comma-separated subset of entsoe,terna,gme,bids"
        required: false
        default: "entsoe,terna,gme,bids"

permissions:
  contents: write

concurrency:
  group: update-balancing
  cancel-in-progress: false

jobs:
  update-balancing:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore current data from the data branch
        run: bash .github/scripts/data-branch.sh restore

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch balancing data
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          TERNA_KEY: ${{ secrets.TERNA_KEY }}
          TERNA_SECRET: ${{ secrets.TERNA_SECRET }}
          GME_API_LOGIN: ${{ secrets.GME_API_LOGIN }}
          GME_API_PASSWORD: ${{ secrets.GME_API_PASSWORD }}
          START: ${{ inputs.start || (github.event_name == 'push' && '2026-09-22' || '') }}
          END: ${{ inputs.end || (github.event_name == 'push' && '2026-09-29' || '') }}
          SOURCES: ${{ inputs.sources || 'entsoe,terna,gme,bids' }}
        run: |
          ARGS=(--sources "$SOURCES")
          if [ -n "$START" ]; then ARGS+=(--start "$START"); fi
          if [ -n "$END" ]; then ARGS+=(--end "$END"); fi
          echo "Running: python etl/fetch_balancing.py ${ARGS[*]}"
          python etl/fetch_balancing.py "${ARGS[@]}"

      - name: Publish updated data to the data branch
        run: |
          mkdir -p app/data/balancing_bids
          bash .github/scripts/data-branch.sh publish app/data/balancing.json app/data/balancing_bids
